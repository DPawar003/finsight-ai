services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight_pass
      POSTGRES_DB: finsight_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: